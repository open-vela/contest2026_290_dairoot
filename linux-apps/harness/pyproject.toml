[project]
name = "harness"
version = "0.1.0"
description = "板上语音对话 demo：麦克风拾音 → ASR → LLM → TTS 播放，带 web 配置台"
requires-python = ">=3.10"
dependencies = [
    # 对话 SDK（LLM 流式、MCP 工具、TTS）。
    "aichat-sdk>=0.1.4",
    # web 配置台（改配置 / 看 llm.messages）。
    "starlette>=0.37",
    "uvicorn>=0.29",
    # 代理 asr-server 的录音文件下载（同源 /audio 路由）。
    "httpx>=0.27",
    # SQLite 聊天记录的 ORM 模型与事务。
    "sqlalchemy>=2.0,<3",
    # mcp/miloco_mcp.py：看摄像头画面 + 开关米家设备的 stdio MCP server。两个包 aichat-sdk 也依赖，
    # 这里因为直接 import 才显式写上。
    "fastmcp>=4",
    "openai>=1.40",
    # 拾音/放音走 sounddevice（系统要有 libportaudio2），PCM 处理用 numpy。
    "sounddevice>=0.5",
    "numpy>=1.24",
    "python-dotenv>=1.0.0",
    # 上传技能的 SKILL.md frontmatter 校验。
    "pyyaml>=6",
]

# main.py / server.py 平铺在本目录，以本目录为工作目录直接 uv run main.py，
# 不需要把自身装进环境。
[tool.uv]
package = false
