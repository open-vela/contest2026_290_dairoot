<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>历史会话 · harness</title>
<style>
:root {
  --bg:#f4f6f8; --card:#fff; --fg:#1b1e23; --muted:#6b7280; --line:#e2e6ea;
  --accent:#2563eb; --ok:#16a34a; --warn:#c2740a; --err:#dc2626;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg:#15171a; --card:#1d2024; --fg:#e6e8eb; --muted:#9aa1a9; --line:#2c3036;
    --accent:#4b8bf5; --ok:#4ade80; --warn:#f0b45e; --err:#f87171;
  }
}
* { box-sizing:border-box; }
body {
  margin:0; background:var(--bg); color:var(--fg);
  font:14px/1.6 -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif;
}
body {
  display:flex; flex-direction:column; height:100vh; height:100dvh; overflow:hidden;
  --history-soft:color-mix(in srgb, var(--accent) 7%, var(--card));
  --history-panel:color-mix(in srgb, var(--bg) 65%, var(--card));
}
header {
  display:flex; flex:none; flex-wrap:wrap; align-items:center; gap:12px;
  padding:12px 18px; background:var(--card); border-bottom:1px solid var(--line);
}
h1 { font-size:15px; margin:0; }
.page-link {
  padding:2px 9px; border:1px solid var(--line); border-radius:99px;
  color:var(--muted); font-size:12px; text-decoration:none;
}
.page-link:hover { color:var(--accent); border-color:var(--accent); }
#history-diary { margin-left:auto; }
main {
  display:flex; flex:1; min-height:0; width:calc(100% - 32px); max-width:1360px; margin:16px auto;
  overflow:hidden; border:1px solid var(--line); border-radius:12px; background:var(--card);
}
button, input {
  font:inherit; padding:7px 14px; border-radius:8px;
  border:1px solid var(--line); background:var(--card); color:var(--fg);
}
button { cursor:pointer; }
button:disabled { opacity:.5; cursor:default; }
button:focus-visible, a:focus-visible, input:focus-visible { outline:2px solid var(--accent); outline-offset:2px; }
.msg .head { display:flex; flex-wrap:wrap; align-items:baseline; gap:8px; }
.body, details pre { white-space:pre-wrap; overflow-wrap:anywhere; }
details pre { font:12px/1.6 ui-monospace, SFMono-Regular, Menlo, monospace; margin:4px 0 0; }
details summary { cursor:pointer; color:var(--muted); font-size:12px; }
.history-date-filter { display:flex; align-items:center; gap:8px; margin-top:12px; }
.history-date-filter label { font-size:12px; color:var(--muted); }
#history-date { flex:1; min-width:0; padding:5px; font-size:12px; }
#history-date-hint { margin:6px 0 0; color:var(--muted); font-size:10px; }
.history-icon { display:block; width:18px; height:18px; flex:none; fill:none; stroke:currentColor; stroke-width:1.65; stroke-linecap:round; stroke-linejoin:round; }
.history-layout { display:grid; grid-template-columns:300px minmax(0, 1fr); width:100%; min-height:0; }
.history-sidebar { display:flex; flex-direction:column; min-height:0; background:var(--history-panel); border-right:1px solid var(--line); }
.history-sidebar-head { padding:24px 20px 16px; }
.history-heading { display:flex; align-items:center; gap:9px; margin-bottom:20px; }
.history-heading > .history-icon { color:var(--accent); width:20px; height:20px; }
.history-heading h2 { margin:0; font-size:17px; font-weight:650; letter-spacing:-.3px; }
.history-searchbox { display:flex; align-items:center; gap:8px; padding:6px 8px 6px 10px; border:1px solid var(--line); border-radius:8px; background:var(--card); }
.history-searchbox:focus-within { border-color:color-mix(in srgb, var(--accent) 60%, var(--line)); box-shadow:0 0 0 3px var(--history-soft); }
#history-search .history-icon { width:15px; height:15px; color:var(--muted); }
#history-query { flex:1; min-width:0; padding:2px 0; border:0; border-radius:0; background:transparent; font-size:12px; outline:none; }
#history-search button { flex:none; padding:2px 5px; border:0; border-radius:4px; color:var(--accent); background:transparent; font-size:11px; }
#history-search button:hover { background:var(--history-soft); }
.history-list-head { display:flex; justify-content:space-between; gap:8px; padding:0 22px 6px; color:var(--muted); font-size:11px; }
#history-status { font-variant-numeric:tabular-nums; }
#history-list { flex:1; min-height:0; overflow-y:auto; padding:0 12px 12px; scrollbar-width:thin; scrollbar-color:var(--line) transparent; }
.history-date { padding:14px 10px 6px; color:var(--muted); font-size:11px; }
.history-item { display:flex; align-items:flex-start; gap:10px; width:100%; margin:3px 0; padding:11px 10px; text-align:left; border:1px solid transparent; border-radius:9px; background:transparent; }
.history-item:hover { background:color-mix(in srgb, var(--card) 75%, transparent); }
.history-item[aria-pressed="true"] { background:var(--card); border-color:color-mix(in srgb, var(--accent) 22%, var(--line)); box-shadow:0 2px 5px #10182806; }
.history-item > .history-icon { width:16px; height:16px; margin-top:2px; color:var(--muted); }
.history-item[aria-pressed="true"] > .history-icon { color:var(--accent); }
.history-item-content { display:block; flex:1; min-width:0; }
.history-preview { display:block; overflow:hidden; white-space:nowrap; text-overflow:ellipsis; font-size:12.5px; font-weight:500; }
.history-item[aria-pressed="true"] .history-preview { color:var(--accent); }
.history-item-meta { display:block; color:var(--muted); font-size:11px; margin-top:4px; }
.history-pagination { display:flex; align-items:center; justify-content:space-between; gap:6px; padding:12px 18px; border-top:1px solid var(--line); }
.history-pagination button { display:flex; align-items:center; gap:3px; padding:4px 6px; border:0; background:transparent; font-size:11px; color:var(--muted); }
.history-pagination button:hover:not(:disabled) { color:var(--accent); }
.history-pagination .history-icon { width:13px; height:13px; }
#history-page { color:var(--muted); font-size:11px; font-variant-numeric:tabular-nums; }
.history-detail { display:flex; flex-direction:column; min-width:0; min-height:0; background:var(--card); }
#history-back { display:none; }
#history-meta:not(:empty) { flex:none; position:relative; padding:25px 30px 20px; border-bottom:1px solid var(--line); }
.history-title-row { display:flex; align-items:center; gap:12px; min-width:0; }
#history-meta h3 { flex:1; min-width:0; margin:0; font-size:17px; font-weight:600; letter-spacing:-.2px; overflow:hidden; white-space:nowrap; text-overflow:ellipsis; }
.history-ended { display:inline-flex; align-items:center; gap:5px; flex:none; border-radius:5px; padding:2px 6px; color:var(--muted); background:var(--bg); font-size:10px; }
.history-ended::before { content:""; width:4px; height:4px; border-radius:50%; background:var(--muted); }
.history-session-subtitle { display:flex; flex-wrap:wrap; gap:6px 12px; margin-top:7px; padding-right:85px; font-size:11px; color:var(--muted); }
.history-session-subtitle span + span::before { content:"·"; margin-right:12px; opacity:.6; }
.history-session-info { position:absolute; right:30px; bottom:19px; z-index:2; }
.history-session-info summary { display:flex; align-items:center; gap:4px; list-style:none; font-size:11px; }
.history-session-info summary::-webkit-details-marker { display:none; }
.history-session-info summary:hover, .history-session-info[open] summary { color:var(--accent); }
.history-session-info summary .history-icon { width:13px; height:13px; }
.history-info-panel { position:absolute; top:26px; right:0; width:300px; padding:14px 16px; border:1px solid var(--line); border-radius:10px; background:var(--card); box-shadow:0 8px 28px #10182815; }
.history-info-panel dl { display:grid; grid-template-columns:auto minmax(0, 1fr); gap:8px 14px; margin:0; font-size:11px; }
.history-info-panel dt { color:var(--muted); }
.history-info-panel dd { margin:0; overflow-wrap:anywhere; }
.history-id { font-family:ui-monospace, SFMono-Regular, Menlo, monospace; }
#history-messages { flex:1; min-height:0; overflow-y:auto; padding:28px 30px; background:color-mix(in srgb, var(--bg) 36%, var(--card)); scrollbar-width:thin; scrollbar-color:var(--line) transparent; }
.history-entry { display:flex; align-items:flex-start; gap:10px; max-width:680px; margin:0 auto 22px; }
.history-avatar { display:grid; place-items:center; flex:none; width:28px; height:28px; margin-top:2px; border:1px solid var(--line); border-radius:9px; background:var(--card); color:var(--muted); font-size:10px; font-weight:650; }
.history-avatar .history-icon { width:15px; height:15px; }
.history-entry.assistant .history-avatar { color:var(--fg); }
.history-entry.user { flex-direction:row-reverse; padding-left:48px; }
.history-entry.user .history-avatar { color:var(--accent); background:var(--history-soft); border-color:transparent; }
#history-messages .msg { flex:0 1 auto; min-width:0; max-width:calc(100% - 38px); margin:0; padding:12px 15px; border:1px solid var(--line); border-radius:2px 12px 12px; background:var(--card); }
#history-messages .msg.user { background:var(--history-soft); border-color:transparent; border-radius:12px 2px 12px 12px; }
#history-messages .msg .head { align-items:center; gap:10px; margin-bottom:5px; }
#history-messages .msg .role { font-size:11px; color:var(--muted); font-weight:500; }
#history-messages .msg.user .role { color:var(--accent); }
#history-messages .msg .meta { font-size:10px; color:var(--muted); }
#history-messages .body { margin:0; font-size:13px; line-height:1.85; }
.history-entry.tool { padding:0 0 0 38px; margin-top:-10px; margin-bottom:20px; }
#history-messages .msg.tool { padding:8px 12px; border-style:dashed; border-radius:8px; background:transparent; }
#history-messages .msg.tool summary { font-size:11px; }
#history-messages details pre { margin-top:8px; font-size:11px; }
#history-messages .tool-call { margin-top:8px; padding:7px 9px; border:1px solid var(--line); border-radius:6px; }
#history-messages .tool-arguments { margin:6px 0; }
#history-messages .msg.tool .tool-name { color:var(--warn); font-weight:500; }
#history-messages .tool-arguments pre, #history-messages .tool-call pre { max-height:240px; overflow:auto; }
.history-placeholder { display:flex; flex-direction:column; align-items:center; justify-content:center; gap:8px; min-height:180px; height:100%; padding:28px 20px; text-align:center; color:var(--muted); }
.history-placeholder > .history-icon { width:30px; height:30px; margin-bottom:4px; opacity:.45; stroke-width:1.2; }
.history-placeholder strong { color:var(--fg); font-size:13px; font-weight:500; }
.history-placeholder span { font-size:11px; line-height:1.8; }
.history-placeholder.history-error strong { color:var(--err); }
.history-sr-only { position:absolute; width:1px; height:1px; padding:0; margin:-1px; overflow:hidden; clip:rect(0, 0, 0, 0); white-space:nowrap; border:0; }
@media (max-width:720px) {
  main { width:100%; margin:0; border:0; border-radius:0; }
  header { padding:10px 12px; }
  .history-layout { display:block; }
  .history-sidebar, .history-detail { height:100%; border:0; }
  .history-detail { display:none; }
  .history-show-detail .history-sidebar { display:none; }
  .history-show-detail .history-detail { display:flex; }
  .history-sidebar-head { padding:23px 20px 18px; }
  .history-heading { margin-bottom:22px; }
  .history-pagination { padding:14px 20px; }
  #history-back { display:flex; align-items:center; gap:5px; align-self:flex-start; margin:20px 56px 0 20px; padding:0; border:0; font-size:11px; background:transparent; color:var(--muted); }
  #history-back .history-icon { width:13px; height:13px; }
  #history-meta:not(:empty) { padding:18px 20px 38px; }
  #history-meta h3 { font-size:16px; }
  .history-session-info { right:20px; bottom:12px; }
  .history-info-panel { width:min(300px, calc(100vw - 64px)); }
  #history-messages { padding:22px 16px; }
  .history-entry { gap:7px; }
  .history-entry.user { padding-left:18px; }
  .history-entry.tool { padding-left:35px; }
  #history-messages .msg { padding:10px 12px; max-width:calc(100% - 35px); }
}
</style>
</head>
<body>
<header>
  <a class="page-link" href="/">← 配置台</a>
  <h1>历史会话</h1>
  <a id="history-diary" class="page-link" href="/diary">AI 日记 →</a>
</header>
<main>
  <div class="history-layout">
    <aside class="history-sidebar" aria-label="会话列表">
      <div class="history-sidebar-head">
        <div class="history-heading">
          <svg class="history-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 4h14a2 2 0 0 1 2 2v10a2 2 0 0 1-2 2H8l-5 3V6a2 2 0 0 1 2-2ZM7 9h10M7 13h6"/></svg>
          <h2 id="history-title">会话列表</h2>
        </div>
        <form id="history-search">
          <div class="history-searchbox">
            <label class="history-sr-only" for="history-query">搜索消息内容或会话 ID</label>
            <svg class="history-icon" viewBox="0 0 24 24" aria-hidden="true"><circle cx="10.5" cy="10.5" r="6.5"/><path d="m16 16 5 5"/></svg>
            <input id="history-query" type="search" maxlength="200" placeholder="搜索对话或会话 ID">
            <button type="submit">搜索</button>
          </div>
          <div class="history-date-filter">
            <label for="history-date">日期</label>
            <input id="history-date" type="date" aria-describedby="history-date-hint">
            <button id="history-clear-date" type="button">全部日期</button>
          </div>
          <p id="history-date-hint">日期按配置台时区筛选，与日记一致</p>
        </form>
      </div>
      <div class="history-list-head">
        <span id="history-list-label">全部会话</span>
        <span id="history-status" role="status" aria-live="polite"></span>
      </div>
      <div id="history-list"></div>
      <div class="history-pagination">
        <button id="history-prev" type="button" disabled><svg class="history-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="m14 6-6 6 6 6"/></svg>上一页</button>
        <span id="history-page"></span>
        <button id="history-next" type="button" disabled>下一页<svg class="history-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="m10 6 6 6-6 6"/></svg></button>
      </div>
    </aside>
    <section class="history-detail" aria-label="会话消息">
      <button id="history-back" type="button"><svg class="history-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="m14 6-6 6 6 6"/></svg>返回列表</button>
      <div id="history-meta" aria-live="polite"></div>
      <div id="history-messages"></div>
    </section>
  </div>
</main>
<script>
const $ = (selector) => document.querySelector(selector);
const ROLE_LABEL = { user: "用户", assistant: "助手", tool: "工具" };

function el(tag, className, text) {
  const node = document.createElement(tag);
  if (className) node.className = className;
  if (text !== undefined) node.textContent = text;
  return node;
}

function formatUsage(usage) {
  const prompt = usage.prompt_tokens || 0;
  const cached = usage.prompt_tokens_details?.cached_tokens || usage.prompt_cache_hit_tokens || 0;
  const hit = prompt && cached ? "（缓存 " + Math.round(cached / prompt * 100) + "%）" : "";
  const ttft = usage.first_chunk_latency_ms ? " · 首包 " + usage.first_chunk_latency_ms + "ms" : "";
  return "↑" + prompt + hit + " ↓" + (usage.completion_tokens || 0) + ttft;
}

function formatArguments(argumentsValue) {
  if (typeof argumentsValue !== "string") return JSON.stringify(argumentsValue, null, 2) ?? "";
  try { return JSON.stringify(JSON.parse(argumentsValue), null, 2); }
  catch { return argumentsValue; }
}

function toolArguments(call, className = "tool-arguments", label = "参数") {
  const details = el("details", className);
  details.append(el("summary", null, label), el("pre", null, formatArguments(call.function?.arguments)));
  return details;
}

function renderMessage(message, call, unmatchedCalls) {
  const wrap = el("div", "msg " + (message.role || "unknown"));
  const head = el("div", "head");
  const toolName = message.role === "tool" ? message.name || call?.function?.name : "";
  const role = el("span", "role" + (toolName ? " tool-name" : ""), toolName || (message.role === "user" && message.speaker)
    || ROLE_LABEL[message.role] || message.role || "未知");
  if (message.tool_call_id) role.title = "调用 ID：" + message.tool_call_id;
  head.append(role);
  const meta = [(message.time || "").slice(11, 19), message.elapsed_time != null ? "耗时 " + message.elapsed_time : "",
    message.usage ? formatUsage(message.usage) : ""].filter(Boolean).join(" · ");
  if (meta) head.append(el("span", "meta", meta));
  wrap.append(head);
  if (message.role === "tool" && call) wrap.append(toolArguments(call));
  const body = String(message.content ?? "");
  if (message.role === "tool" && body) {
    const details = el("details", "tool-result");
    details.append(el("summary", null, "工具结果"), el("pre", null, body));
    wrap.append(details);
  } else if (body) {
    wrap.append(el("div", "body", body));
  }
  for (const toolCall of unmatchedCalls) {
    const details = toolArguments(toolCall, "tool-call", "调用 " + (toolCall.function?.name || "未知工具"));
    if (toolCall.id) details.title = "调用 ID：" + toolCall.id;
    wrap.append(details);
  }
  return wrap;
}

const HISTORY_PAGE_SIZE = 20;
const initialParams = new URLSearchParams(location.search);
let historyQuery = initialParams.get("q") || "";
let historyDate = initialParams.get("date") || "";
let historyOffset = 0;
let historyListRequest = null;
let historyDetailRequest = null;

function historyTime(value) {
  const date = new Date(value);
  return Number.isNaN(date.getTime()) ? value : date.toLocaleString("zh-CN", { hour12: false });
}

function historyIcon(name = "chat") {
  const paths = {
    chat: "M5 4h14a2 2 0 0 1 2 2v10a2 2 0 0 1-2 2H8l-5 3V6a2 2 0 0 1 2-2ZM7 9h10M7 13h6",
    user: "M16 7a4 4 0 1 1-8 0 4 4 0 0 1 8 0ZM5 21v-2a7 7 0 0 1 14 0v2",
    assistant: "m12 3 2.7 6.3L21 12l-6.3 2.7L12 21l-2.7-6.3L3 12l6.3-2.7Z",
    info: "M22 12a10 10 0 1 1-20 0 10 10 0 0 1 20 0ZM12 11v6m0-10v.01",
  };
  const svg = document.createElementNS("http://www.w3.org/2000/svg", "svg");
  svg.setAttribute("class", "history-icon");
  svg.setAttribute("viewBox", "0 0 24 24");
  svg.setAttribute("aria-hidden", "true");
  const path = document.createElementNS(svg.namespaceURI, "path");
  path.setAttribute("d", paths[name] || paths.chat);
  svg.append(path);
  return svg;
}

function historyPlaceholder(title, subtitle = "", error = false) {
  const box = el("div", "history-placeholder" + (error ? " history-error" : ""));
  box.append(historyIcon(), el("strong", null, title));
  if (subtitle) box.append(el("span", null, subtitle));
  return box;
}

function historyMessageText(message) {
  return String(message?.content ?? "").trim();
}

function historyDuration(session) {
  const seconds = Math.round((new Date(session.ended_at) - new Date(session.started_at)) / 1000);
  if (!Number.isFinite(seconds) || seconds < 0) return "";
  if (seconds < 60) return seconds + " 秒";
  const minutes = Math.floor(seconds / 60);
  if (minutes < 60) return minutes + " 分钟";
  return Math.floor(minutes / 60) + " 小时" + (minutes % 60 ? " " + minutes % 60 + " 分钟" : "");
}

function historyDay(value) {
  const date = new Date(value);
  if (Number.isNaN(date.getTime())) return "日期未知";
  const today = new Date();
  const yesterday = new Date(today);
  yesterday.setDate(today.getDate() - 1);
  if (date.toDateString() === today.toDateString()) return "今天";
  if (date.toDateString() === yesterday.toDateString()) return "昨天";
  return date.toLocaleDateString("zh-CN", {
    month: "long", day: "numeric", ...(date.getFullYear() !== today.getFullYear() ? { year: "numeric" } : {}),
  });
}

function renderHistoryMessage(message, toolCalls, unmatchedCalls) {
  const role = message.role || "unknown";
  if (role === "assistant" && !historyMessageText(message) && !message.usage && !unmatchedCalls.length) return null;
  const row = el("div", "history-entry " + role);
  const node = renderMessage(message, toolCalls.get(message.tool_call_id), unmatchedCalls);
  if (role !== "tool") {
    const avatar = el("div", "history-avatar");
    avatar.setAttribute("aria-hidden", "true");
    avatar.append(historyIcon(role));
    row.append(avatar);
  }
  if (role === "user" && node.querySelector(".role").textContent === ROLE_LABEL.user) node.querySelector(".role").textContent = "你";
  if (role === "tool") {
    const summary = node.querySelector(".tool-result summary");
    if (summary) {
      summary.textContent = "工具结果 · " + String(message.content).length + " 字";
    }
  }
  row.append(node);
  return row;
}

function renderHistoryMeta(session) {
  const meta = $("#history-meta");
  const heading = el("div", "history-title-row");
  const title = historyMessageText(session.messages.find((message) => message.role === "user")) || "会话记录";
  const name = el("h3", null, title.replace(/\s+/g, " "));
  name.title = title;
  heading.append(name, el("span", "history-ended", "已结束"));
  const subtitle = el("div", "history-session-subtitle");
  for (const text of [historyTime(session.started_at), historyDuration(session), session.messages.length + " 条消息"]) {
    if (text) subtitle.append(el("span", null, text));
  }
  const info = el("details", "history-session-info");
  const summary = el("summary");
  summary.append(historyIcon("info"), document.createTextNode("会话信息"));
  const panel = el("div", "history-info-panel");
  const description = el("dl");
  for (const [label, value] of [["会话 ID", session.id], ["开始时间", historyTime(session.started_at)],
                               ["结束时间", historyTime(session.ended_at)]]) {
    description.append(el("dt", null, label), el("dd", label === "会话 ID" ? "history-id" : null, value));
  }
  panel.append(description);
  info.append(summary, panel);
  meta.replaceChildren(heading, subtitle, info);
}

async function historyFetch(url, request) {
  const res = await fetch(url, { signal: request.signal, cache: "no-store" });
  const data = await res.json();
  if (!res.ok || !data.ok) throw new Error(data.error || "查询失败，请重试");
  return data;
}

async function loadHistoryDetail(sessionId, showDetail = true) {
  if (historyDetailRequest) historyDetailRequest.abort();
  const request = historyDetailRequest = new AbortController();
  if (showDetail) {
    $(".history-layout").classList.add("history-show-detail");
    if (matchMedia("(max-width:720px)").matches) $("#history-back").focus();
  }
  for (const button of $("#history-list").querySelectorAll("button")) {
    button.setAttribute("aria-pressed", String(button.dataset.sessionId === sessionId));
  }
  $("#history-meta").replaceChildren();
  $("#history-messages").replaceChildren(historyPlaceholder("正在加载对话…"));
  try {
    const data = await historyFetch("/api/sessions/" + encodeURIComponent(sessionId), request);
    if (request !== historyDetailRequest) return;
    const session = data.session;
    renderHistoryMeta(session);
    const toolCalls = new Map();
    const nodes = session.messages.map((message, index) => {
      // 调用 ID 只在当前工具调用批次中配对，后续模型请求可能复用同一个 ID。
      if (message.role === "assistant" || message.role === "user") toolCalls.clear();
      let unmatchedCalls = [];
      if (message.role === "assistant") {
        for (const call of message.tool_calls || []) {
          if (call.id) toolCalls.set(call.id, call);
        }
        // 已有结果的调用统一在工具卡片展示参数，助手里只留下尚无结果的调用。
        const resultIds = new Set();
        for (let next = index + 1; next < session.messages.length; next++) {
          const result = session.messages[next];
          if (result.role === "assistant" || result.role === "user") break;
          if (result.role === "tool" && result.tool_call_id) resultIds.add(result.tool_call_id);
        }
        unmatchedCalls = (message.tool_calls || []).filter((call) => !call.id || !resultIds.has(call.id));
      }
      return renderHistoryMessage(message, toolCalls, unmatchedCalls);
    }).filter(Boolean);
    $("#history-messages").replaceChildren(...(nodes.length ? nodes : [historyPlaceholder("暂无消息")]));
    $("#history-messages").scrollTop = 0;
  } catch (error) {
    if (error.name === "AbortError" || request !== historyDetailRequest) return;
    $("#history-messages").replaceChildren(historyPlaceholder("暂时无法加载对话", error.message, true));
  }
}

async function loadHistory(offset = 0) {
  if (historyListRequest) historyListRequest.abort();
  if (historyDetailRequest) historyDetailRequest.abort();
  const request = historyListRequest = new AbortController();
  $(".history-layout").classList.remove("history-show-detail");
  const address = new URL(location.href);
  address.search = "";
  if (historyQuery) address.searchParams.set("q", historyQuery);
  if (historyDate) address.searchParams.set("date", historyDate);
  if (offset) address.searchParams.set("offset", offset);
  history.replaceState(null, "", address);
  $("#history-diary").href = "/diary" + (historyDate ? "#" + historyDate : "");
  $("#history-clear-date").disabled = !historyDate;
  $("#history-list-label").textContent = historyDate
    ? historyDate + (historyQuery ? " · 搜索结果" : " 的会话") : historyQuery ? "搜索结果" : "全部会话";
  $("#history-status").textContent = "查询中…";
  $("#history-list").replaceChildren();
  $("#history-list").setAttribute("aria-busy", "true");
  $("#history-meta").replaceChildren();
  $("#history-messages").replaceChildren(historyPlaceholder("选择一段对话", "在会话列表中选择，查看聊天记录"));
  $("#history-prev").disabled = $("#history-next").disabled = true;
  $("#history-page").textContent = "";
  try {
    const params = new URLSearchParams({ q: historyQuery, date: historyDate, limit: HISTORY_PAGE_SIZE, offset });
    const data = await historyFetch("/api/sessions?" + params, request);
    if (request !== historyListRequest) return;
    historyOffset = data.offset;
    $("#history-status").textContent = data.total + " 个";
    $("#history-page").textContent = data.total ? (Math.floor(data.offset / data.limit) + 1)
      + " / " + Math.ceil(data.total / data.limit) : "";
    $("#history-prev").disabled = data.offset === 0;
    $("#history-next").disabled = data.offset + data.sessions.length >= data.total;
    const nodes = [];
    let lastDay = null;
    for (const session of data.sessions) {
      const day = historyDate || historyDay(session.started_at);
      if (day !== lastDay) nodes.push(el("div", "history-date", day));
      lastDay = day;
      const button = el("button", "history-item");
      button.type = "button";
      button.dataset.sessionId = session.id;
      button.setAttribute("aria-pressed", "false");
      const content = el("span", "history-item-content");
      content.append(el("span", "history-preview", session.preview || "未命名会话"));
      const clock = new Date(session.started_at).toLocaleTimeString("zh-CN", { hour: "2-digit", minute: "2-digit", hour12: false });
      content.append(el("span", "history-item-meta", clock + " · " + session.message_count + " 条消息"));
      button.append(historyIcon(), content);
      button.addEventListener("click", () => loadHistoryDetail(session.id));
      nodes.push(button);
    }
    $("#history-list").replaceChildren(...(nodes.length ? nodes : [historyPlaceholder(historyQuery
      ? "没有找到相关对话" : historyDate ? "这天没有历史会话" : "还没有历史会话",
      historyQuery ? "换一个关键词，或清空搜索再试试"
        : historyDate ? "试试其他日期，或查看全部日期的会话" : "会话结束后，记录会保存在这里")]));
    if (data.sessions.length) loadHistoryDetail(data.sessions[0].id, false);
  } catch (error) {
    if (error.name === "AbortError" || request !== historyListRequest) return;
    $("#history-status").textContent = "加载失败";
    $("#history-list").replaceChildren(historyPlaceholder("暂时无法加载", error.message, true));
  } finally {
    if (request === historyListRequest) $("#history-list").setAttribute("aria-busy", "false");
  }
}

$("#history-back").addEventListener("click", () => {
  $(".history-layout").classList.remove("history-show-detail");
  const selected = $("#history-list").querySelector('.history-item[aria-pressed="true"]');
  if (selected) selected.focus();
});
$("#history-search").addEventListener("submit", (event) => {
  event.preventDefault();
  applyHistoryFilters();
});
$("#history-prev").addEventListener("click", () => loadHistory(Math.max(0, historyOffset - HISTORY_PAGE_SIZE)));
$("#history-next").addEventListener("click", () => loadHistory(historyOffset + HISTORY_PAGE_SIZE));

function applyHistoryFilters() {
  historyQuery = $("#history-query").value.trim();
  historyDate = $("#history-date").value;
  loadHistory();
}

$("#history-date").addEventListener("change", applyHistoryFilters);
$("#history-clear-date").addEventListener("click", () => {
  $("#history-date").value = "";
  applyHistoryFilters();
});
$("#history-query").value = historyQuery;
$("#history-date").value = historyDate;
const initialOffset = Number(initialParams.get("offset"));
loadHistory(Number.isSafeInteger(initialOffset) && initialOffset >= 0 ? initialOffset : 0);
</script>
